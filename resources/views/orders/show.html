<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FuelDrop | Track order</title>
    <meta name="description" content="Order petrol, diesel or paraffin and follow the delivery driver live on the map.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: { DEFAULT: '#0f1b2d', 800: '#1b2a42', 900: '#0f1b2d' },
                        brand: { 400: '#f7b84b', 500: '#f5a623', 600: '#d98e0f' },
                        cream: '#fff4df',
                    },
                    fontFamily: { sans: ['DM Sans', 'system-ui', '-apple-system', 'sans-serif'] },
                }
            }
        };
    </script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" href="../assets/css/styles.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-100 text-navy font-sans antialiased" data-page="track">
    <div class="md:flex min-h-screen">
        <!-- Start: Sidebar -->
        <aside class="bg-navy text-slate-300 md:w-64 p-4 md:fixed md:inset-y-0 flex md:flex-col gap-1 overflow-x-auto">
            <div class="text-white px-4 py-3 md:mb-6">
                <a href="../index.html" class="flex items-center gap-2 font-bold text-xl">
                    <i data-lucide="droplet" class="text-brand-500 fill-brand-500"></i>
                    FuelDrop
                </a>
            </div>
            <a href="../dashboard.html" class="flex items-center gap-3 px-4 py-3 rounded-lg whitespace-nowrap hover:bg-white/5">
                <i data-lucide="layout-dashboard" class="w-5 h-5"></i>
                Dashboard
            </a>
            <a href="../orders/create.html" class="flex items-center gap-3 px-4 py-3 rounded-lg whitespace-nowrap hover:bg-white/5">
                <i data-lucide="fuel" class="w-5 h-5"></i>
                Order fuel
            </a>
            <a href="../orders/index.html" class="flex items-center gap-3 px-4 py-3 rounded-lg whitespace-nowrap bg-white/10 text-white">
                <i data-lucide="list" class="w-5 h-5"></i>
                My orders
            </a>
            <a href="../notifications.html" class="flex items-center gap-3 px-4 py-3 rounded-lg whitespace-nowrap hover:bg-white/5">
                <i data-lucide="bell" class="w-5 h-5"></i>
                Notifications
            </a>
            <a href="../profile.html" class="flex items-center gap-3 px-4 py-3 rounded-lg whitespace-nowrap hover:bg-white/5">
                <i data-lucide="user" class="w-5 h-5"></i>
                Profile
            </a>
            <a href="../login.html" class="flex items-center gap-3 px-4 py-3 md:mt-auto hover:bg-white/5 rounded-lg whitespace-nowrap">
                <i data-lucide="log-out" class="w-5 h-5"></i>
                Sign out
            </a>
        </aside>
        <!-- End: Sidebar -->

        <!-- Start: Main content -->
        <main class="flex-1 md:ml-64 p-6 md:p-10">
            <div class="max-w-5xl mx-auto">
                <div class="flex flex-wrap justify-between items-center gap-3 mb-8">
                    <h1 class="text-3xl font-bold">Track order</h1>
                </div>
                <!-- Start: Live tracking -->
                <div class="grid lg:grid-cols-3 gap-6">
                    <div class="bg-white border border-slate-200 rounded-2xl p-6 lg:col-span-2">
                        <h2 class="text-2xl font-bold" data-bind="trTitle"></h2>
                        <p class="text-slate-500 mt-1">Order <span data-bind="ordNo"></span> · Arriving in about <span data-bind="eta"></span> min</p>
                        <div id="map" class="h-80 rounded-2xl mt-5 z-0"></div>
                        <div id="steps" class="grid grid-cols-4 gap-3 mt-6 text-sm">
                            <div>Confirmed</div>
                            <div>Loaded</div>
                            <div>On the way</div>
                            <div>Delivered</div>
                        </div>
                    </div>
                    <div class="bg-white border border-slate-200 rounded-2xl p-6 self-start">
                        <h3 class="text-lg font-bold">Driver</h3>
                        <div class="font-bold mt-3">Moses Kato</div>
                        <div class="text-slate-500 mb-5">UBK 482T</div>
                        <a href="tel:+256700000000" class="inline-block rounded-lg px-5 py-2.5 font-bold text-center bg-brand-500 text-navy w-full">Call driver</a>
                        <button id="cancel" class="mt-3 w-full rounded-lg border border-navy py-2.5 font-bold">Cancel order</button>
                    </div>
                </div>
                <!-- End: Live tracking -->
            </div>
        </main>
        <!-- End: Main content -->
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="../assets/js/app.js"></script>
    <script>lucide.createIcons();</script>
</body>
</html>
