<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FuelDrop | Order fuel</title>
    <meta name="description" content="Order petrol, diesel or paraffin and follow the delivery driver live on the map.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: { DEFAULT: '#0f1b2d', 800: '#1b2a42', 900: '#0f1b2d' },
                        brand: { 400: '#f7b84b', 500: '#f5a623', 600: '#d98e0f' },
                        cream: '#fff4df',
                    },
                    fontFamily: { sans: ['DM Sans', 'system-ui', '-apple-system', 'sans-serif'] },
                }
            }
        };
    </script>
    <link rel="stylesheet" href="../assets/css/styles.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-100 text-navy font-sans antialiased" data-page="order">
    <div class="md:flex min-h-screen">
        <!-- Start: Sidebar -->
        <aside class="bg-navy text-slate-300 md:w-64 p-4 md:fixed md:inset-y-0 flex md:flex-col gap-1 overflow-x-auto">
            <div class="text-white px-4 py-3 md:mb-6">
                <a href="../index.html" class="flex items-center gap-2 font-bold text-xl">
                    <i data-lucide="droplet" class="text-brand-500 fill-brand-500"></i>
                    FuelDrop
                </a>
            </div>
            <a href="../dashboard.html" class="flex items-center gap-3 px-4 py-3 rounded-lg whitespace-nowrap hover:bg-white/5">
                <i data-lucide="layout-dashboard" class="w-5 h-5"></i>
                Dashboard
            </a>
            <a href="../orders/create.html" class="flex items-center gap-3 px-4 py-3 rounded-lg whitespace-nowrap bg-white/10 text-white">
                <i data-lucide="fuel" class="w-5 h-5"></i>
                Order fuel
            </a>
            <a href="../orders/index.html" class="flex items-center gap-3 px-4 py-3 rounded-lg whitespace-nowrap hover:bg-white/5">
                <i data-lucide="list" class="w-5 h-5"></i>
                My orders
            </a>
            <a href="../notifications.html" class="flex items-center gap-3 px-4 py-3 rounded-lg whitespace-nowrap hover:bg-white/5">
                <i data-lucide="bell" class="w-5 h-5"></i>
                Notifications
            </a>
            <a href="../profile.html" class="flex items-center gap-3 px-4 py-3 rounded-lg whitespace-nowrap hover:bg-white/5">
                <i data-lucide="user" class="w-5 h-5"></i>
                Profile
            </a>
            <a href="../login.html" class="flex items-center gap-3 px-4 py-3 md:mt-auto hover:bg-white/5 rounded-lg whitespace-nowrap">
                <i data-lucide="log-out" class="w-5 h-5"></i>
                Sign out
            </a>
        </aside>
        <!-- End: Sidebar -->

        <!-- Start: Main content -->
        <main class="flex-1 md:ml-64 p-6 md:p-10">
            <div class="max-w-5xl mx-auto">
                <div class="flex flex-wrap justify-between items-center gap-3 mb-8">
                    <h1 class="text-3xl font-bold">Order fuel</h1>
                </div>
                <!-- Start: Order form -->
                <form id="orderForm" class="grid lg:grid-cols-3 gap-6">
                    <div class="lg:col-span-2">
                        <div class="bg-white border border-slate-200 rounded-2xl p-6">
                            <p class="text-slate-500 mb-5">Delivered to your vehicle or site. Step 1 of 3</p>
                            <h2 class="text-lg font-bold mb-3">Fuel type</h2>
                            <div class="grid sm:grid-cols-3 gap-3">
                                <label class="cursor-pointer">
                                    <input type="radio" name="fuel" value="petrol" class="peer sr-only" checked>
                                    <div class="rounded-xl border border-slate-300 bg-white p-4 h-full peer-checked:bg-cream peer-checked:border-navy peer-checked:ring-1 peer-checked:ring-navy peer-focus-visible:ring-2">
                                        <div class="font-bold text-blue-600">Petrol</div>
                                        <div class="text-sm text-slate-500"><span data-price="petrol"></span> / L</div>
                                    </div>
                                </label>
                                <label class="cursor-pointer">
                                    <input type="radio" name="fuel" value="diesel" class="peer sr-only">
                                    <div class="rounded-xl border border-slate-300 bg-white p-4 h-full peer-checked:bg-cream peer-checked:border-navy peer-checked:ring-1 peer-checked:ring-navy peer-focus-visible:ring-2">
                                        <div class="font-bold text-blue-600">Diesel</div>
                                        <div class="text-sm text-slate-500"><span data-price="diesel"></span> / L</div>
                                    </div>
                                </label>
                                <label class="cursor-pointer">
                                    <input type="radio" name="fuel" value="paraffin" class="peer sr-only">
                                    <div class="rounded-xl border border-slate-300 bg-white p-4 h-full peer-checked:bg-cream peer-checked:border-navy peer-checked:ring-1 peer-checked:ring-navy peer-focus-visible:ring-2">
                                        <div class="font-bold text-blue-600">Paraffin</div>
                                        <div class="text-sm text-slate-500"><span data-price="paraffin"></span> / L</div>
                                    </div>
                                </label>
                            </div>
                            <div class="grid sm:grid-cols-2 gap-5 mt-6">
                                <div class="">
                                    <label for="qty" class="block text-sm mb-1">Quantity (litres)</label>
                                    <input id="qty" name="qty" type="number" value="40" placeholder="" class="input-field">
                                </div>
                                <div class="">
                                    <label for="vehicle" class="block text-sm mb-1">Vehicle</label>
                                    <select id="vehicle" name="vehicle" class="input-field">
                                        <option>Toyota Hilux – UBA 123K</option>
                                        <option>Isuzu FRR – UBE 456M</option>
                                        <option>Honda CG125 – UEX 789P</option>
                                    </select>
                                </div>
                            </div>
                            <div class="mt-6">
                                <div class="">
                                    <label for="addr" class="block text-sm mb-1">Delivery address</label>
                                    <input id="addr" name="addr" type="text" value="" placeholder="Search address or drop a pin" class="input-field">
                                </div>
                            </div>
                            <h2 class="text-lg font-bold mt-6 mb-3">Delivery time</h2>
                            <div class="flex flex-wrap gap-3">
                                <label class="cursor-pointer">
                                    <input type="radio" name="time" value="ASAP (60–90 min)" class="peer sr-only">
                                    <div class="rounded-xl border border-slate-300 bg-white p-4 h-full peer-checked:bg-cream peer-checked:border-navy peer-checked:ring-1 peer-checked:ring-navy peer-focus-visible:ring-2">
                                        <div class="font-bold text-blue-600">ASAP (60–90 min)</div>
                                    </div>
                                </label>
                                <label class="cursor-pointer">
                                    <input type="radio" name="time" value="Today, 2–4 pm" class="peer sr-only">
                                    <div class="rounded-xl border border-slate-300 bg-white p-4 h-full peer-checked:bg-cream peer-checked:border-navy peer-checked:ring-1 peer-checked:ring-navy peer-focus-visible:ring-2">
                                        <div class="font-bold text-blue-600">Today, 2–4 pm</div>
                                    </div>
                                </label>
                                <label class="cursor-pointer">
                                    <input type="radio" name="time" value="Scheduled" class="peer sr-only">
                                    <div class="rounded-xl border border-slate-300 bg-white p-4 h-full peer-checked:bg-cream peer-checked:border-navy peer-checked:ring-1 peer-checked:ring-navy peer-focus-visible:ring-2">
                                        <div class="font-bold text-blue-600">Scheduled</div>
                                    </div>
                                </label>
                            </div>
                        </div>
                    </div>
                    <div class="bg-white border border-slate-200 rounded-2xl p-6 self-start">
                        <h3 class="text-lg font-bold mb-4">Summary</h3>
                        <div class="flex justify-between text-slate-500 py-1"><span data-bind="line"></span><span data-bind="amount"></span></div>
                        <div class="flex justify-between text-slate-500 py-1"><span>Delivery fee</span><span data-bind="fee"></span></div>
                        <div class="flex justify-between font-bold text-lg border-t border-slate-200 mt-3 pt-3 mb-5"><span>Total</span><span data-bind="total"></span></div>
                        <button class="w-full rounded-lg bg-brand-500 py-3 font-bold">Continue to payment</button>
                    </div>
                </form>
                <!-- End: Order form -->
            </div>
        </main>
        <!-- End: Main content -->
    </div>

    <script src="../assets/js/app.js"></script>
    <script>lucide.createIcons();</script>
</body>
</html>
