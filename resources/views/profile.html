<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FuelDrop | Profile</title>
    <meta name="description" content="Order petrol, diesel or paraffin and follow the delivery driver live on the map.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: { DEFAULT: '#0f1b2d', 800: '#1b2a42', 900: '#0f1b2d' },
                        brand: { 400: '#f7b84b', 500: '#f5a623', 600: '#d98e0f' },
                        cream: '#fff4df',
                    },
                    fontFamily: { sans: ['DM Sans', 'system-ui', '-apple-system', 'sans-serif'] },
                }
            }
        };
    </script>
    <link rel="stylesheet" href="assets/css/styles.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-100 text-navy font-sans antialiased" data-page="">
    <div class="md:flex min-h-screen">
        <!-- Start: Sidebar -->
        <aside class="bg-navy text-slate-300 md:w-64 p-4 md:fixed md:inset-y-0 flex md:flex-col gap-1 overflow-x-auto">
            <div class="text-white px-4 py-3 md:mb-6">
                <a href="index.html" class="flex items-center gap-2 font-bold text-xl">
                    <i data-lucide="droplet" class="text-brand-500 fill-brand-500"></i>
                    FuelDrop
                </a>
            </div>
            <a href="dashboard.html" class="flex items-center gap-3 px-4 py-3 rounded-lg whitespace-nowrap hover:bg-white/5">
                <i data-lucide="layout-dashboard" class="w-5 h-5"></i>
                Dashboard
            </a>
            <a href="orders/create.html" class="flex items-center gap-3 px-4 py-3 rounded-lg whitespace-nowrap hover:bg-white/5">
                <i data-lucide="fuel" class="w-5 h-5"></i>
                Order fuel
            </a>
            <a href="orders/index.html" class="flex items-center gap-3 px-4 py-3 rounded-lg whitespace-nowrap hover:bg-white/5">
                <i data-lucide="list" class="w-5 h-5"></i>
                My orders
            </a>
            <a href="notifications.html" class="flex items-center gap-3 px-4 py-3 rounded-lg whitespace-nowrap hover:bg-white/5">
                <i data-lucide="bell" class="w-5 h-5"></i>
                Notifications
            </a>
            <a href="profile.html" class="flex items-center gap-3 px-4 py-3 rounded-lg whitespace-nowrap bg-white/10 text-white">
                <i data-lucide="user" class="w-5 h-5"></i>
                Profile
            </a>
            <a href="login.html" class="flex items-center gap-3 px-4 py-3 md:mt-auto hover:bg-white/5 rounded-lg whitespace-nowrap">
                <i data-lucide="log-out" class="w-5 h-5"></i>
                Sign out
            </a>
        </aside>
        <!-- End: Sidebar -->

        <!-- Start: Main content -->
        <main class="flex-1 md:ml-64 p-6 md:p-10">
            <div class="max-w-5xl mx-auto">
                <div class="flex flex-wrap justify-between items-center gap-3 mb-8">
                    <h1 class="text-3xl font-bold">Profile</h1>
                </div>
                <!-- Start: Form -->
                <div class="bg-white border border-slate-200 rounded-2xl p-6">
                    <form onsubmit="event.preventDefault();location.href='dashboard.html'" class="grid sm:grid-cols-2 gap-5">
                        <div class="">
                            <label for="n" class="block text-sm mb-1">Full name</label>
                            <input id="n" name="n" type="text" value="Carey" placeholder="" class="input-field">
                        </div>
                        <div class="">
                            <label for="ph" class="block text-sm mb-1">Phone</label>
                            <input id="ph" name="ph" type="tel" value="0772 123 456" placeholder="" class="input-field">
                        </div>
                        <div class="">
                            <label for="e" class="block text-sm mb-1">Email</label>
                            <input id="e" name="e" type="email" value="carey@example.com" placeholder="" class="input-field">
                        </div>
                        <div class="">
                            <label for="a" class="block text-sm mb-1">Default address</label>
                            <input id="a" name="a" type="text" value="Kampala" placeholder="" class="input-field">
                        </div>
                        <div class="">
                            <label for="p" class="block text-sm mb-1">New password</label>
                            <input id="p" name="p" type="password" value="" placeholder="Leave blank to keep current" class="input-field">
                        </div>
                        <div class="sm:col-span-2 flex gap-3">
                            <button class="rounded-lg bg-brand-500 px-5 py-2.5 font-bold">Save changes</button>
                            <a href="dashboard.html" class="inline-block rounded-lg px-5 py-2.5 font-bold text-center border border-navy bg-white">Cancel</a>
                        </div>
                    </form>
                </div>
                <!-- End: Form -->
            </div>
        </main>
        <!-- End: Main content -->
    </div>

    <script src="assets/js/app.js"></script>
    <script>lucide.createIcons();</script>
</body>
</html>
